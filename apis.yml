name: Replica Studios
description: >-
  Replica Studios (operated by Replica Media Pty Ltd) built AI voice, text-to-speech
  (TTS) and speech-to-speech (STS) technology for creators, game developers, and
  software teams. Its platform offered an AI Voice Library of 40+ expressive voices,
  Voice Lab for blending up to five voices into a custom character, and Voice Director
  for generating voice overs and dialogue. Developers integrated these capabilities
  through the Replica API v2 (OpenAPI 3.0.0) — a REST API supporting text-to-speech,
  speech-to-speech, and voice-listing operations, authenticated with API keys or
  Bearer JWTs minted at the /v2/auth endpoint. Replica Studios was a Techstars
  portfolio company. The company ceased operations on 2025-06-30; the marketing site
  now shows a farewell page and the api.replicastudios.com host no longer resolves,
  so this profile is a historical/discovery record captured from public documentation.
